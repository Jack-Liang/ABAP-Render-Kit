<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UI5 showcase 依赖探测</title>
</head>
<body>
<div id="log" style="font: 13px monospace; padding: 12px; white-space: pre-wrap;"></div>
<script>
  var log = document.getElementById("log");
  function w(msg) { var d = document.createElement("div"); d.textContent = msg; log.appendChild(d); }
  window.onerror = function (m) { w("JS ERROR: " + m); return false; };
</script>
<script src="https://sdk.openui5.org/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.f,sap.ui.layout"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script>
  var mods = ["sap/f/ShellBar","sap/m/App","sap/m/VBox","sap/m/HBox",
    "sap/m/Toolbar","sap/m/ToolbarSpacer","sap/m/Button","sap/m/SearchField",
    "sap/m/Title","sap/m/Text","sap/m/ObjectStatus","sap/m/ObjectNumber",
    "sap/m/Table","sap/m/Column","sap/m/Label","sap/m/ColumnListItem",
    "sap/m/MessageToast","sap/ui/core/BusyIndicator","sap/ui/core/Html",
    "sap/ui/model/json/JSONModel"];
  var state = {};
  var n = 0;
  var iv = setInterval(function () {
    n += 1;
    if (typeof sap !== "undefined" && sap.ui) {
      clearInterval(iv);
      w("core ready, echarts=" + typeof window.echarts + ", probing " + mods.length);
      mods.forEach(function (m) {
        state[m] = "pending";
        sap.ui.require([m],
          function () { state[m] = "OK"; w("OK: " + m); },
          function (e) { state[m] = "ERR"; w("ERR: " + m + " " + (e && e.message || e)); });
      });
      setTimeout(function () {
        mods.forEach(function (m) { if (state[m] === "pending") w("PENDING: " + m); });
        w("== done ==");
      }, 20000);
    } else if (n > 20) { clearInterval(iv); w("core not ready"); }
  }, 500);
</script>
</body>
</html>
